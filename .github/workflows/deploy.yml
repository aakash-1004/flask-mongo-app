name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test_app.py -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: aakash0908/flask-mongo-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" > /home/ubuntu/.env.flask-app
            echo "MONGO_DB=${{ secrets.MONGO_DB }}" >> /home/ubuntu/.env.flask-app
            echo "MONGO_COLLECTION=${{ secrets.MONGO_COLLECTION }}" >> /home/ubuntu/.env.flask-app
            chmod 600 /home/ubuntu/.env.flask-app
            docker pull aakash0908/flask-mongo-app:latest
            docker stop flask-app || true
            docker rm flask-app || true
            docker run -d \
              --name flask-app \
              -p 80:5000 \
              --env-file /home/ubuntu/.env.flask-app \
              aakash0908/flask-mongo-app:latest
